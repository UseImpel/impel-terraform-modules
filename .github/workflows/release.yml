# Consumers pin modules by immutable tag (`?ref=v1.2.3`), so a tag here is a
# release. This workflow refuses to let a tag point at code that does not pass
# CI, and refuses to let an existing tag be moved.
#
# Retagging is the failure mode that matters: a consumer that pinned v1.0.0
# would silently get different code on its next `terraform init`, which is
# exactly the guarantee pinning is supposed to provide.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.14.4
  TFLINT_VERSION: v0.64.0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag must be on main
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main."
            exit 1
          fi

      - name: Tag must be semver
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            echo "::group::terraform validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done < <(find modules -mindepth 1 -maxdepth 1 -type d | sort)

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
