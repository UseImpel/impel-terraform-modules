# Weekly, grouped update PRs against main. Every PR still goes through the
# modules pipeline; a merged update that changes module source is released by
# the normal plan-release -> publish path (conventional title decides the bump).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    # Let a fresh release age a week before proposing it (compromised-release
    # window); security updates are not delayed by this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Release tooling used by plan-release (semver + conventional-recommended-bump).
  # Lives outside .github/: Dependabot's token may not write under .github/
  # unless the change is a workflow file, so updates there fail with a 400.
  - package-ecosystem: npm
    directory: /tools/release
    target-branch: main
    schedule:
      interval: weekly
    # Let a fresh release age a week before proposing it (compromised-release
    # window); security updates are not delayed by this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      release-tooling:
        patterns: ["*"]

  # Provider constraints in modules/*/versions.tf. A constraint bump changes
  # what consumers resolve, so these PRs are `fix(deps)` and cut a patch release.
  - package-ecosystem: terraform
    directories:
      - /modules/*
    target-branch: main
    schedule:
      interval: weekly
    # Let a fresh release age a week before proposing it (compromised-release
    # window); security updates are not delayed by this.
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix
      include: scope
    groups:
      terraform-providers:
        patterns: ["*"]
